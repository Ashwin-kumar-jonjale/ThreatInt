[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threatint"
version = "0.1.0"
description = "Automated threat-intelligence collection, cross-verification, ML classification and campaign clustering pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ThreatInt" }]
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
threatint = "threatint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
threatint = ["data/**/*.csv", "data/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
